name: CI - Smoke Tests

on:
  pull_request:
    paths:
      - '**.php'
      - 'resources/**'
      - '.github/**'
  push:
    branches: [ 'main', 'master' ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.1'

      - name: Get Composer Cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install node modules
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare SQLite DB
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Create .env for CI
        run: |
          cp .env.example .env
          php -r "file_put_contents('.env', str_replace(['DB_CONNECTION=mysql','DB_DATABASE=laravel'], ['DB_CONNECTION=sqlite','DB_DATABASE='.'database/database.sqlite'], file_get_contents('.env')));

      - name: Generate key
        run: php artisan key:generate --ansi

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Framework sanity checks
        run: |
          php artisan route:list
          php artisan view:clear

      - name: Run tests (if present)
        run: |
          if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            php artisan test --no-interaction
          else
            echo 'No tests found, skipping.'
          fi
